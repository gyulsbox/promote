name: Weekly memory promotion digest

# Runs `promote-cli` once a week, applies high-confidence candidates,
# and opens a single bundled PR. Also runnable on demand from the Actions tab.

on:
  schedule:
    - cron: "0 9 * * 1"   # every Monday 09:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write         # push the branch
  pull-requests: write    # open the PR

jobs:
  scan-and-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Persist .promote/ across runs so candidate IDs, snooze/ignore
      # decisions, and cross-run dedup survive week over week.
      #
      # The key MUST be unique per run, with a prefix in restore-keys.
      # actions/cache skips the save step entirely on an exact key hit, so a
      # single fixed key freezes the very first run's state forever: every
      # later run restores week 1 and saves nothing. A unique key always
      # misses exactly, so it always saves; restore-keys then falls back to
      # the newest entry sharing the prefix.
      - name: Restore promote state
        uses: actions/cache@v4
        with:
          path: .promote
          key: promote-${{ github.repository }}-${{ github.run_id }}
          restore-keys: |
            promote-${{ github.repository }}-

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # The PR body carries a checkbox per candidate. Unchecking one and
      # leaving the PR open (or closing it) is how the team says no: the next
      # run reads those boxes back and stops proposing what was rejected.
      # --max-candidates keeps each PR small enough to actually get read;
      # anything over the cap waits for a later run rather than being dropped.
      - name: Run promote scan + create PR
        env:
          # Used by gh CLI and the octokit fallback.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pick whichever provider your repo is configured for in .promote.yml.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          npx -y promote-cli@latest scan \
            --no-interactive \
            --min-confidence 0.85 \
            --max-candidates 8 \
            --create-pr
